[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcpbench"]

[project]
name = "toolbench-mcp"
version = "0.2.0"
description = "Benchmark tool-calling reliability for MCP servers"
dependencies = ["anthropic", "fastmcp", "click"]

[project.scripts]
mcpbench = "mcpbench.cli:cli"
